name: CI

on:
  push:
    branches: [ "main", "master", "staging" ]
  pull_request:
    branches: [ "main", "master", "staging" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hr_user
          POSTGRES_PASSWORD: hr_password
          POSTGRES_DB: gate0a
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install Root Dependencies
      run: npm ci

    - name: Install Client Dependencies
      run: npm ci
      working-directory: client

    - name: Install Server Dependencies
      run: npm ci
      working-directory: server

    - name: Set up Environment
      run: |
        cd server
        cp .env.example .env

    - name: Prisma Generate & Migrate
      run: |
        cd server
        npx prisma generate
        npx prisma migrate deploy
        npm run prisma:seed
        
    - name: Run Root Verify
      run: npm run verify

    - name: Run Lint
      run: npm run lint

    - name: Run Client Tests
      run: npm run test --prefix client -- --run

    - name: Audit Server Production Dependencies
      run: npm audit --omit=dev --audit-level=high
      working-directory: server

    - name: Audit Client Production Dependencies
      run: npm audit --omit=dev --audit-level=high
      working-directory: client
