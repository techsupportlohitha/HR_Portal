services:
  - type: web
    name: hr-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: hr-db
    databaseName: hrmanagement
    user: hr_user
    plan: free
